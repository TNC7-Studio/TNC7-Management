<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNC7 Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-yellow: #facc15;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 1rem;
            min-height: 100vh;
        }

        /* Top Glowing Border */
        .app-container {
            border-top: 2px solid var(--accent-yellow);
            box-shadow: 0 -10px 20px rgba(250, 204, 21, 0.05);
            max-width: 1400px;
            margin: 0 auto;
            border-radius: 12px;
        }

        /* HEADER */
        header {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-box { 
            background: rgba(250, 204, 21, 0.1); width: 45px; height: 45px; 
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            border: 1px solid rgba(250, 204, 21, 0.3); position: relative;
        }
        .logo-box i { color: var(--accent-yellow); font-size: 1.5rem; }
        .status-dot { 
            position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px; 
            background: var(--accent-green); border-radius: 50%; border: 2px solid var(--panel-bg);
        }
        .title h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
        .title p { color: var(--accent-yellow); font-size: 0.75rem; font-weight: 600; margin-top: 2px; text-transform: uppercase; }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .badge { 
            border: 1px solid rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.05);
            color: var(--accent-green); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
        }
        .icon-group { display: flex; gap: 5px; border: 1px solid var(--border-color); border-radius: 20px; padding: 4px; }
        .icon-btn { background: transparent; border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 1.2rem 1.5rem; display: flex; align-items: center; gap: 15px;
        }
        .stat-icon {
            width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem;
        }
        .stat-card:nth-child(1) .stat-icon { background: rgba(250, 204, 21, 0.1); color: var(--accent-yellow); border: 1px solid rgba(250, 204, 21, 0.3); }
        .stat-card:nth-child(2) .stat-icon { background: rgba(34, 197, 94, 0.1); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
        .stat-card:nth-child(3) .stat-icon { background: rgba(250, 204, 21, 0.1); color: var(--accent-yellow); border: 1px solid rgba(250, 204, 21, 0.3); }
        .stat-card:nth-child(4) .stat-icon { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
        
        .stat-info p { color: var(--text-muted); font-size: 0.75rem; font-weight: 700; margin-bottom: 2px; }
        .stat-info h3 { font-size: 1.5rem; font-weight: 800; }

        /* MAIN PANEL */
        .main-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 1.5rem; min-height: 500px; }
        
        .toolbar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .toolbar-top h2 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
        .toolbar-actions { display: flex; gap: 10px; }
        
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: #555; }
        .btn-yellow { background: var(--accent-yellow); border: none; color: #000; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-yellow:hover { background: #eab308; }

        .filters { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        .search-box { position: relative; flex: 1; max-width: 300px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
        .search-box input { 
            width: 100%; background: transparent; border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 10px 10px 10px 35px; color: var(--text-main); outline: none; font-size: 0.85rem;
        }
        .filter-select { background: transparent; border: 1px solid var(--border-color); border-radius: 8px; padding: 0 15px; color: var(--text-main); font-size: 0.85rem; font-weight: 600; outline: none; }

        /* TABLE */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-size: 0.75rem; font-weight: 800; color: var(--text-main); padding: 15px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        td { font-size: 0.85rem; padding: 15px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }

        /* MODAL FOR FORM */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 2rem; border-radius: 20px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group select {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none;
        }
        .input-group input:focus { border-color: var(--accent-yellow); }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="logo-box">
                <i class="fa-brands fa-youtube"></i>
                <div class="status-dot"></div>
            </div>
            <div class="title">
                <h1>TNC7 MANAGEMENT</h1>
                <p id="clock">Memuat Waktu...</p>
            </div>
        </div>
        <div class="header-right">
            <div class="badge"><i class="fa-solid fa-cloud"></i> CLOUD SYNC AKTIF</div>
            <div class="badge"><i class="fa-solid fa-circle-dot" style="font-size:8px;"></i> AUTO-SYNC</div>
            <div class="icon-group">
                <button class="icon-btn"><i class="fa-solid fa-gear"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-palette"></i></button>
            </div>
        </div>
    </header>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-display"></i></div>
            <div class="stat-info">
                <p>TOTAL CHANNEL</p>
                <h3 id="stat-total">0</h3>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-dollar-sign"></i></div>
            <div class="stat-info">
                <p>SUDAH MONETISASI</p>
                <h3 id="stat-monet">0</h3>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-display"></i></div>
            <div class="stat-info">
                <p>CHANNEL AKTIF</p>
                <h3 id="stat-aktif">0</h3>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-plus-circle"></i></div>
            <div class="stat-info">
                <p>BARU (24 JAM)</p>
                <h3 id="stat-baru">0</h3>
            </div>
        </div>
    </div>

    <!-- MAIN PANEL -->
    <div class="main-panel">
        <div class="toolbar-top">
            <h2>DAFTAR CHANNEL & AKUN</h2>
            <div class="toolbar-actions">
                <button class="btn-outline" onclick="openModal()"><i class="fa-solid fa-magnifying-glass"></i> CARI YT</button>
                <button class="btn-yellow" onclick="openModal()"><i class="fa-solid fa-plus"></i> TAMBAH CHANNEL</button>
            </div>
        </div>

        <div class="filters">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="CARI NAMA, ID, NICHE..." onkeyup="filterTable()">
            </div>
            <select class="filter-select"><option>SEMUA MONETISASI</option></select>
            <select class="filter-select"><option>SEMUA PENGELOLA</option></select>
            <select class="filter-select"><option>URUTAN ASLI</option></select>
            <button class="btn-outline" style="border-radius: 20px;"><i class="fa-solid fa-xmark"></i> RESET FILTER</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NO</th>
                        <th>NAMA CHANNEL</th>
                        <th>LINK</th>
                        <th>SUBSCRIBERS</th>
                        <th>TOTAL VIEWS</th>
                        <th>VIDEO</th>
                        <th>PENGELOLA</th>
                        <th>NICHE</th>
                        <th>MONET</th>
                        <th>AKSI</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="10" class="empty-state">BELUM ADA DATA...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH/EDIT -->
<div class="modal" id="formModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-plus-circle" style="color: var(--accent-yellow);"></i> Data Channel</h3>
            <button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="channelForm" onsubmit="saveChannel(event)">
            <input type="hidden" id="editId">
            <input type="hidden" id="avatarUrl">
            <input type="hidden" id="ytChannelId">

            <div class="input-group">
                <label>Pencarian Otomatis YT (Masukkan URL/ID/Username)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="urlInput" placeholder="Cth: https://youtube.com/@..." required style="flex:1;">
                    <button type="button" class="btn-yellow" onclick="searchYouTube()" id="btnSearchYt">CARI YT</button>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>Nama Channel</label>
                    <input type="text" id="nameInput" required>
                </div>
                <div class="input-group">
                    <label>Pengelola</label>
                    <input type="text" id="pengelolaInput" placeholder="Nama Tim">
                </div>
                <div class="input-group">
                    <label>Niche / Kategori</label>
                    <select id="categoryInput">
                        <option value="Hiburan">Hiburan</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Edukasi">Edukasi</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Status Monet</label>
                    <select id="monetInput">
                        <option value="Belum">Belum</option>
                        <option value="Sudah">Sudah</option>
                    </select>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <div class="input-group"><label>Subscribers</label><input type="text" id="subsInput" value="0"></div>
                <div class="input-group"><label>Total Views</label><input type="text" id="viewsInput" value="0"></div>
                <div class="input-group"><label>Total Video</label><input type="text" id="videoInput" value="0"></div>
            </div>

            <div style="text-align: right; margin-top: 10px;">
                <button type="submit" class="btn-yellow" id="btnSave">SIMPAN DATA</button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts Khusus UI (Jam) -->
<script>
    function updateClock() {
        const now = new Date();
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        let dateStr = now.toLocaleDateString('id-ID', options).toUpperCase();
        let timeStr = now.toLocaleTimeString('id-ID').replace(/\./g, ':');
        document.getElementById('clock').innerText = `${dateStr} – ${timeStr} WIB`;
    }
    setInterval(updateClock, 1000); updateClock();

    function openModal() { document.getElementById('formModal').style.display = 'flex'; }
    function closeModal() { 
        document.getElementById('formModal').style.display = 'none'; 
        document.getElementById('channelForm').reset();
        document.getElementById('editId').value = '';
    }
</script>

<!-- Script Firebase & Backend -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Kofigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyA1hxTceWANgQU8vwKpXDCJABvYpWQQNmk",
      authDomain: "tnc7-visualizer.firebaseapp.com",
      projectId: "tnc7-visualizer",
      storageBucket: "tnc7-visualizer.firebasestorage.app",
      messagingSenderId: "1098792876538",
      appId: "1:1098792876538:web:28304ee128f7d156190c43"
    };
    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

    // API YT
    const DEFAULT_API_KEY = "AIzaSyC3bbs6Qwr54GA5O5qR4ikFWNPBttyDw1k";

    let channels = [];

    // Mulai Sync Realtime
    window.onload = () => {
        const channelsRef = collection(db, "public/data/channels");
        onSnapshot(channelsRef, (snapshot) => {
            channels = [];
            let totalMonet = 0;
            snapshot.forEach((doc) => {
                const data = doc.data();
                channels.push({ id: doc.id, ...data });
                if(data.monet === 'Sudah') totalMonet++;
            });
            renderTable();
            
            // Update Stat Cards
            document.getElementById('stat-total').innerText = channels.length;
            document.getElementById('stat-monet').innerText = totalMonet;
            document.getElementById('stat-aktif').innerText = channels.length; // Asumsi semua aktif
        });
    };

    window.saveChannel = async (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value || Date.now().toString();
        const newChannel = {
            url: document.getElementById('urlInput').value,
            name: document.getElementById('nameInput').value,
            category: document.getElementById('categoryInput').value,
            monet: document.getElementById('monetInput').value,
            pengelola: document.getElementById('pengelolaInput').value || '-',
            subscriber: document.getElementById('subsInput').value,
            views: document.getElementById('viewsInput').value,
            videos: document.getElementById('videoInput').value,
            avatar: document.getElementById('avatarUrl').value || 'https://via.placeholder.com/40',
            ytId: document.getElementById('ytChannelId').value || '',
            timestamp: Date.now()
        };

        const btn = document.getElementById('btnSave');
        btn.innerText = 'MENYIMPAN...'; btn.disabled = true;

        try {
            await setDoc(doc(db, "public/data/channels", id), newChannel);
            closeModal();
        } catch (error) { alert("Gagal menyimpan ke Cloud!"); } 
        finally { btn.innerText = 'SIMPAN DATA'; btn.disabled = false; }
    };

    window.deleteChannel = async (id) => {
        if(confirm('Hapus channel ini?')) await deleteDoc(doc(db, "public/data/channels", id));
    };

    window.editChannel = (id) => {
        const ch = channels.find(c => c.id === id);
        if(ch) {
            document.getElementById('editId').value = ch.id;
            document.getElementById('urlInput').value = ch.url;
            document.getElementById('nameInput').value = ch.name;
            document.getElementById('categoryInput').value = ch.category;
            document.getElementById('monetInput').value = ch.monet || 'Belum';
            document.getElementById('pengelolaInput').value = ch.pengelola || '';
            document.getElementById('subsInput').value = ch.subscriber;
            document.getElementById('viewsInput').value = ch.views || '0';
            document.getElementById('videoInput').value = ch.videos || '0';
            document.getElementById('avatarUrl').value = ch.avatar;
            document.getElementById('ytChannelId').value = ch.ytId || '';
            openModal();
        }
    };

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if(channels.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="empty-state">BELUM ADA DATA...</td></tr>';
            return;
        }
        
        channels.sort((a,b) => b.timestamp - a.timestamp).forEach((ch, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="color: #fff; font-weight: bold;">${index + 1}</td>
                <td style="color: #fff; font-weight: bold; display: flex; align-items: center; gap:10px;">
                    <img src="${ch.avatar}" style="width: 30px; height: 30px; border-radius: 50%;"> 
                    ${ch.name}
                </td>
                <td><a href="${ch.url}" target="_blank" style="color: var(--accent-blue); text-decoration: none;">Link YT</a></td>
                <td style="color: #fff;">${ch.subscriber}</td>
                <td>${ch.views || '0'}</td>
                <td>${ch.videos || '0'}</td>
                <td>${ch.pengelola || '-'}</td>
                <td><span style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">${ch.category}</span></td>
                <td>
                    <span style="color: ${ch.monet === 'Sudah' ? 'var(--accent-green)' : 'var(--text-muted)'}; font-weight: bold;">
                        ${ch.monet || 'Belum'}
                    </span>
                </td>
                <td>
                    <button class="icon-btn" onclick="editChannel('${ch.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="icon-btn" onclick="deleteChannel('${ch.id}')" style="color:#ef4444;"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.filterTable = () => {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        if(rows.length === 1 && rows[0].innerText.includes("BELUM ADA DATA")) return;
        Array.from(rows).forEach(row => {
            const name = row.cells[1].innerText.toLowerCase();
            row.style.display = name.includes(query) ? '' : 'none';
        });
    };

    window.searchYouTube = async () => {
        let inputUrl = document.getElementById('urlInput').value.trim();
        if(!inputUrl) return alert("Masukkan ID/URL YouTube!");
        const btn = document.getElementById('btnSearchYt');
        btn.innerText = '...'; btn.disabled = true;

        try {
            let channelId = "";
            if (inputUrl.includes('youtube.com/channel/')) {
                channelId = inputUrl.split('youtube.com/channel/')[1].split('/')[0].split('?')[0];
            } else if (inputUrl.includes('youtube.com/@') || inputUrl.startsWith('@')) {
                let username = inputUrl.includes('youtube.com/@') ? inputUrl.split('youtube.com/@')[1].split('/')[0].split('?')[0] : inputUrl.substring(1);
                const handleRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${username}&key=${DEFAULT_API_KEY}`);
                const handleData = await handleRes.json();
                if (handleData.items && handleData.items.length > 0) channelId = handleData.items[0].snippet.channelId;
            } else { channelId = inputUrl; }

            const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${DEFAULT_API_KEY}`);
            const data = await res.json();
            if(data.items && data.items.length > 0) {
                const snippet = data.items[0].snippet;
                const stats = data.items[0].statistics;
                document.getElementById('nameInput').value = snippet.title;
                document.getElementById('subsInput').value = formatNumber(stats.subscriberCount);
                document.getElementById('viewsInput').value = formatNumber(stats.viewCount);
                document.getElementById('videoInput').value = formatNumber(stats.videoCount);
                document.getElementById('avatarUrl').value = snippet.thumbnails.default.url;
                document.getElementById('ytChannelId').value = channelId;
            }
        } catch (e) { alert("Gagal mengambil data YT."); } 
        finally { btn.innerText = 'CARI YT'; btn.disabled = false; }
    };

    function formatNumber(num) {
        if(!num) return "0";
        if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }
</script>
</body>
</html>

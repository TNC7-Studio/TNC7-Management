<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#161921">
    <title>TNC7 MANAGEMENT - TEAM SYNC</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #161921;
            --panel-bg: rgba(26, 31, 41, 0.95);
            --panel-border: rgba(56, 189, 248, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --input-bg: rgba(13, 16, 21, 0.7);
            --primary-accent: #facc15;
            --primary-hover: #eab308;
            --table-hover: rgba(56, 189, 248, 0.08);
            --header-bg: rgba(26, 31, 41, 0.98);
        }

        [data-theme="terang"] {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(241, 245, 249, 0.7);
            --primary-accent: #3b82f6;
            --primary-hover: #2563eb;
            --table-hover: rgba(59, 130, 246, 0.05);
            --header-bg: rgba(255, 255, 255, 0.98);
        }

        [data-theme="kuning"] {
            --bg-color: #1a1c19;
            --panel-bg: rgba(26, 28, 25, 0.95);
            --panel-border: rgba(250, 204, 21, 0.3);
            --text-main: #fefce8;
            --text-muted: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.5);
            --primary-accent: #facc15;
            --primary-hover: #eab308;
            --table-hover: rgba(250, 204, 21, 0.08);
            --header-bg: rgba(26, 28, 25, 0.98);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Navbar / Header */
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-accent); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo i { font-size: 1.8rem; }
        
        .header-controls { display: flex; align-items: center; gap: 15px; }
        
        /* Auto Sync Indicator */
        .sync-indicator {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }
        .sync-indicator i { font-size: 0.7rem; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .icon-btn {
            background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem;
            cursor: pointer; transition: color 0.2s, transform 0.2s; padding: 8px;
        }
        .icon-btn:hover { color: var(--primary-accent); transform: scale(1.1); }

        /* Main Container */
        .container { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
        
        .panel {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); backdrop-filter: blur(12px);
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--panel-border); padding-bottom: 1rem; }
        .panel-header h2 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }

        /* Input Controls */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .input-group input, .input-group select {
            background: var(--input-bg); border: 1px solid var(--panel-border);
            color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary-accent); }
        
        .yt-search-wrapper { display: flex; gap: 8px; }
        .yt-search-wrapper input { flex: 1; }

        .btn-primary { background: var(--primary-accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-hover); }

        /* Table */
        .table-responsive { overflow-x: auto; border-radius: 12px; border: 1px solid var(--panel-border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.2); padding: 12px 15px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); white-space: nowrap; }
        td { padding: 15px; border-bottom: 1px solid var(--panel-border); vertical-align: middle; }
        tr:hover { background: var(--table-hover); }
        tr:last-child td { border-bottom: none; }
        
        .channel-info { display: flex; align-items: center; gap: 12px; }
        .channel-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--panel-border); }
        .channel-name { font-weight: 700; color: var(--primary-accent); font-size: 1rem; }
        
        .btn-action { background: rgba(255,255,255,0.1); border: none; color: var(--text-main); padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; margin-right: 5px; }
        .btn-action:hover { background: rgba(255,255,255,0.2); }
        .btn-delete:hover { background: #ef4444; color: white; }

        /* Modal Pengaturan */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        
        .theme-options { display: flex; gap: 10px; margin-top: 15px; }
        .theme-btn { flex: 1; padding: 10px; border: 1px solid var(--panel-border); background: var(--input-bg); color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600; }
        .theme-btn:hover { border-color: var(--primary-accent); }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-satellite-dish"></i> TNC7
        </div>
        <div class="header-controls">
            <div class="sync-indicator">
                <i class="fa-solid fa-circle-dot"></i> AUTO-SYNC TIM
            </div>
            <button class="icon-btn" onclick="openSettings()" title="Pengaturan Tampilan"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <!-- Main Dashboard -->
    <div class="container" id="dashboard">
        
        <!-- Form Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-plus-circle"></i> Tambah / Edit Channel</h2>
            </div>
            <form id="channelForm" onsubmit="saveChannel(event)">
                <input type="hidden" id="editId">
                <input type="hidden" id="avatarUrl">
                <input type="hidden" id="ytChannelId">

                <div class="form-grid">
                    <div class="input-group">
                        <label>ID Channel / Username YT</label>
                        <div class="yt-search-wrapper">
                            <input type="text" id="urlInput" placeholder="Cth: UCa_..." required>
                            <button type="button" class="btn-primary" onclick="searchYouTube()" id="btnSearchYt" title="Cari Data di YouTube">
                                <i class="fa-brands fa-youtube"></i> Cari YT
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Nama Channel</label>
                        <input type="text" id="nameInput" placeholder="Otomatis dari YT..." required>
                    </div>
                    <div class="input-group">
                        <label>Kategori</label>
                        <select id="categoryInput" required>
                            <option value="Hiburan">Hiburan</option>
                            <option value="Edukasi">Edukasi</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Berita">Berita</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Subscriber</label>
                        <input type="text" id="subsInput" placeholder="Otomatis / Manual">
                    </div>
                </div>
                <div style="text-align: right;">
                    <button type="submit" class="btn-primary" id="btnSave">
                        <i class="fa-solid fa-save"></i> Simpan Channel
                    </button>
                </div>
            </form>
        </div>

        <!-- Table Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-list"></i> Database Channel Tim</h2>
                <div class="input-group" style="width: 250px;">
                    <input type="text" id="searchInput" placeholder="Cari channel..." onkeyup="filterTable()">
                </div>
            </div>
            <div class="table-responsive">
                <table id="channelTable">
                    <thead>
                        <tr>
                            <th>Channel</th>
                            <th>Kategori</th>
                            <th>Subscriber</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data akan dirender di sini oleh Firebase -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Pengaturan Tema -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeSettings()"><i class="fa-solid fa-times"></i></button>
            <h2 style="margin-bottom: 1rem;"><i class="fa-solid fa-palette"></i> Pengaturan Tampilan</h2>
            
            <label style="font-size: 0.9rem; color: var(--text-muted);">Pilih Tema Aplikasi:</label>
            <div class="theme-options">
                <button class="theme-btn" onclick="setTheme('gelap')">Gelap</button>
                <button class="theme-btn" onclick="setTheme('terang')">Terang</button>
                <button class="theme-btn" onclick="setTheme('kuning')">Kuning</button>
            </div>
        </div>
    </div>

    <!-- Firebase & Logic Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================
        // 1. KONFIGURASI FIREBASE ASLI ANDA
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyA1hxTceWANgQU8vwKpXDCJABvYpWQQNmk",
          authDomain: "tnc7-visualizer.firebaseapp.com",
          projectId: "tnc7-visualizer",
          storageBucket: "tnc7-visualizer.firebasestorage.app",
          messagingSenderId: "1098792876538",
          appId: "1:1098792876538:web:28304ee128f7d156190c43"
        };

        const app = initializeApp(firebaseConfig);
        
        // Mengaktifkan Offline Caching Firestore
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
        });

        // ==========================================
        // 2. API KEY YOUTUBE ANDA (Disembunyikan dari Tim)
        // ==========================================
        const DEFAULT_API_KEY = "AIzaSyC3bbs6Qwr54GA5O5qR4ikFWNPBttyDw1k";

        // State Aplikasi
        let channels = [];
        let unsubscribeSync = null;

        // Inisialisasi Aplikasi Saat Halaman Dibuka
        window.onload = () => {
            loadTheme();
            startSyncingChannels(); // Langsung terhubung ke Database Tim
        };

        // --- SISTEM SINKRONISASI TIM (REAL-TIME CLOUD) ---
        function startSyncingChannels() {
            const channelsRef = collection(db, "public/data/channels");
            
            // onSnapshot otomatis update tabel saat ada perubahan di server
            unsubscribeSync = onSnapshot(channelsRef, (snapshot) => {
                channels = [];
                snapshot.forEach((doc) => {
                    channels.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            }, (error) => {
                console.error("Error Syncing Database:", error);
                alert("Gagal terhubung ke Database Tim. Cek koneksi Anda.");
            });
        }

        // --- MANAJEMEN DATA CHANNEL ---
        window.saveChannel = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value || Date.now().toString();
            const newChannel = {
                url: document.getElementById('urlInput').value,
                name: document.getElementById('nameInput').value,
                category: document.getElementById('categoryInput').value,
                subscriber: document.getElementById('subsInput').value,
                avatar: document.getElementById('avatarUrl').value || 'https://via.placeholder.com/40',
                ytId: document.getElementById('ytChannelId').value || '',
                timestamp: Date.now()
            };

            const btn = document.getElementById('btnSave');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            btn.disabled = true;

            try {
                // Simpan langsung ke Cloud Publik
                await setDoc(doc(db, "public/data/channels", id), newChannel);
                resetForm();
            } catch (error) {
                console.error("Error Saving:", error);
                alert("Gagal menyimpan ke Cloud!");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-save"></i> Simpan Channel';
                btn.disabled = false;
            }
        };

        window.deleteChannel = async (id) => {
            if(confirm('Hapus channel ini dari database tim?')) {
                try {
                    await deleteDoc(doc(db, "public/data/channels", id));
                } catch (error) {
                    console.error("Error Deleting:", error);
                    alert("Gagal menghapus data dari Cloud!");
                }
            }
        };

        window.editChannel = (id) => {
            const ch = channels.find(c => c.id === id);
            if(ch) {
                document.getElementById('editId').value = ch.id;
                document.getElementById('urlInput').value = ch.url;
                document.getElementById('nameInput').value = ch.name;
                document.getElementById('categoryInput').value = ch.category;
                document.getElementById('subsInput').value = ch.subscriber;
                document.getElementById('avatarUrl').value = ch.avatar;
                document.getElementById('ytChannelId').value = ch.ytId || '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function resetForm() {
            document.getElementById('channelForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('avatarUrl').value = '';
            document.getElementById('ytChannelId').value = '';
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            channels.sort((a,b) => b.timestamp - a.timestamp).forEach(ch => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="channel-info">
                            <img src="${ch.avatar}" class="channel-avatar" alt="Avatar">
                            <div>
                                <div class="channel-name">${ch.name}</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">${ch.url.substring(0, 20)}...</div>
                            </div>
                        </div>
                    </td>
                    <td><span style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">${ch.category}</span></td>
                    <td><i class="fa-solid fa-users" style="color: var(--text-muted);"></i> ${ch.subscriber}</td>
                    <td>
                        <button class="btn-action" onclick="editChannel('${ch.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-action btn-delete" onclick="deleteChannel('${ch.id}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.filterTable = () => {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');
            Array.from(rows).forEach(row => {
                const name = row.cells[0].innerText.toLowerCase();
                row.style.display = name.includes(query) ? '' : 'none';
            });
        };

        // --- PENCARIAN YOUTUBE API ---
        window.searchYouTube = async () => {
            let inputUrl = document.getElementById('urlInput').value.trim();
            if(!inputUrl) return alert("Masukkan ID Channel, Username (@), atau URL YouTube!");

            const btn = document.getElementById('btnSearchYt');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                let channelId = "";
                
                // Ekstrak ID/Username dari URL
                if (inputUrl.includes('youtube.com/channel/')) {
                    channelId = inputUrl.split('youtube.com/channel/')[1].split('/')[0].split('?')[0];
                } else if (inputUrl.includes('youtube.com/@') || inputUrl.startsWith('@')) {
                    let username = inputUrl.includes('youtube.com/@') ? inputUrl.split('youtube.com/@')[1].split('/')[0].split('?')[0] : inputUrl.substring(1);
                    const handleRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${username}&key=${DEFAULT_API_KEY}`);
                    const handleData = await handleRes.json();
                    if (handleData.items && handleData.items.length > 0) channelId = handleData.items[0].snippet.channelId;
                } else {
                    channelId = inputUrl; 
                }

                if (!channelId) throw new Error("ID/Username Channel tidak ditemukan.");

                // Ambil Detail Channel
                const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${DEFAULT_API_KEY}`);
                const data = await res.json();

                if(data.items && data.items.length > 0) {
                    const snippet = data.items[0].snippet;
                    const stats = data.items[0].statistics;
                    
                    document.getElementById('nameInput').value = snippet.title;
                    document.getElementById('subsInput').value = formatNumber(stats.subscriberCount);
                    document.getElementById('avatarUrl').value = snippet.thumbnails.default.url;
                    document.getElementById('ytChannelId').value = channelId;
                } else {
                    alert("Data channel tidak ditemukan di YouTube.");
                }
            } catch (error) {
                console.error("YouTube API Error:", error);
                alert("Gagal mengambil data dari YouTube. Cek URL/ID atau limit API Key.");
            } finally {
                btn.innerHTML = '<i class="fa-brands fa-youtube"></i> Cari YT';
                btn.disabled = false;
            }
        };

        function formatNumber(num) {
            if(!num) return "0";
            if(num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if(num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // --- PENGATURAN UI (TEMA) ---
        window.openSettings = () => document.getElementById('settingsModal').style.display = 'flex';
        window.closeSettings = () => document.getElementById('settingsModal').style.display = 'none';
        
        window.setTheme = (themeName) => {
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('tnc7_theme', themeName); // Tema tetap disimpan lokal per perangkat
        };

        function loadTheme() {
            const savedTheme = localStorage.getItem('tnc7_theme') || 'gelap';
            setTheme(savedTheme);
        }
    </script>
</body>
</html>
